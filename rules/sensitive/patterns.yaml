detector: sensitive_info
version: "1.0"
patterns:
  # ── Secrets & Credentials ──
  - name: api_key_header
    display: "API Key in header"
    regex: "(?:api[_-]?key|apikey|access[_-]?key|x-api-key)[\\s:=]+['\"]?([A-Za-z0-9_\\-]{16,})['\"]?"
    mask_type: secret
    priority: 1
    confidence: 0.95
    replacement: "[REDACTED_API_KEY]"

  - name: openai_key
    display: "OpenAI API Key"
    regex: "sk-(?:proj-)?[A-Za-z0-9_\\-]{32,}"
    mask_type: secret
    priority: 1
    confidence: 0.99
    replacement: "[REDACTED_API_KEY]"

  - name: github_token
    display: "GitHub Token"
    regex: "(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{32,}"
    mask_type: secret
    priority: 1
    confidence: 0.99
    replacement: "[REDACTED_TOKEN]"

  - name: jwt_token
    display: "JWT Token"
    regex: "eyJ[A-Za-z0-9_\\-]{20,}\\.[A-Za-z0-9_\\-]{20,}\\.[A-Za-z0-9_\\-]{0,}"
    mask_type: secret
    priority: 1
    confidence: 0.90
    replacement: "[REDACTED_JWT]"

  - name: private_key_header
    display: "Private Key Header"
    regex: "-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----"
    mask_type: secret
    priority: 1
    confidence: 0.99
    replacement: "[REDACTED_PRIVATE_KEY]"

  - name: generic_secret
    display: "Generic Secret Assignment"
    regex: "(?:secret|password|passwd|pwd|token|credential)[\\s:=]+['\"]([^'\"]{4,})['\"]"
    mask_type: secret
    priority: 2
    confidence: 0.70
    replacement: "[REDACTED_SECRET]"

  - name: db_connection_string
    display: "Database Connection String"
    regex: "(?:mysql|postgres|postgresql|mongodb|redis|sqlite|oracle|mssql)://[^\\s]{5,}"
    mask_type: secret
    priority: 1
    confidence: 0.95
    replacement: "[REDACTED_CONNECTION_STRING]"

  # ── PII ──
  - name: email_address
    display: "Email Address"
    regex: "[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}"
    mask_type: pii
    priority: 10
    confidence: 0.95
    replacement: "[REDACTED_EMAIL]"

  - name: phone_cn
    display: "Chinese Phone Number"
    regex: "(?:\\+?86[\\- ]?)?1[3-9]\\d{9}"
    mask_type: pii
    priority: 10
    confidence: 0.90
    replacement: "[REDACTED_PHONE]"

  - name: id_card_cn
    display: "Chinese ID Card Number"
    regex: "[1-9]\\d{5}(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])\\d{3}[0-9Xx]"
    mask_type: pii
    priority: 10
    confidence: 0.95
    replacement: "[REDACTED_ID_CARD]"

  - name: ip_address
    display: "IP Address"
    regex: "(?:\\d{1,3}\\.){3}\\d{1,3}(?::\\d{2,5})?"
    mask_type: pii
    priority: 20
    confidence: 0.80
    replacement: "[REDACTED_IP]"

  - name: bank_card_cn
    display: "Chinese Bank Card Number"
    regex: "(?:62|60|55|53|52|51|46|45|44|43|42|41|40)\\d{14,18}"
    mask_type: pii
    priority: 10
    confidence: 0.85
    replacement: "[REDACTED_BANK_CARD]"

  # ── Internal / Infra ──
  - name: internal_path
    display: "Internal File Path"
    regex: "(?:/home/|/etc/|/var/|/opt/|C:\\\\|/usr/)[^\\s]{3,}"
    mask_type: internal_asset
    priority: 30
    confidence: 0.60
    replacement: "[REDACTED_PATH]"

  - name: env_variable
    display: "Environment Variable"
    regex: "(?:export\\s+)?[A-Z_]{4,30}=['\"][^'\"]{3,}['\"]"
    mask_type: secret
    priority: 15
    confidence: 0.70
    replacement: "[REDACTED_ENV_VAR]"

  - name: aws_access_key
    display: "AWS Access Key"
    regex: "AKIA[0-9A-Z]{16}"
    mask_type: secret
    priority: 1
    confidence: 0.99
    replacement: "[REDACTED_AWS_KEY]"

  - name: aws_secret_key
    display: "AWS Secret Key"
    regex: "(?:aws[_-]?secret|secret[_-]?key)[\\s:=]+['\"]([A-Za-z0-9/+]{30,})['\"]"
    mask_type: secret
    priority: 1
    confidence: 0.95
    replacement: "[REDACTED_AWS_SECRET]"
